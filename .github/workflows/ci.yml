name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: LaTeX core (QuickJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install QuickJS binding
        run: pip install quickjs
      - name: Run core round-trip tests
        run: python3 tests/jsrunner.py

  server:
    name: HTTP API end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install TeX + PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            latexmk poppler-utils
      - name: Run API integration tests
        run: python3 tests/test_server.py
